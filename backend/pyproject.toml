[project]
name = "priorart-atlas-backend"
version = "0.1.0"
description = "PriorArt Atlas backend: schema, search service and data loading"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "cryptography>=50.0.2",
    "slowapi>=0.1.10",
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["demo: needs the demo corpus loaded in the dev database and the real models"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "app.api.deps.require"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E731"]
"app/api/v1/reports.py" = ["E501"]
"alembic/versions/*.py" = ["E501", "I001", "UP007", "UP035"]
