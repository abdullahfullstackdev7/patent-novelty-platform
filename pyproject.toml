[project]
name = "priorart-atlas-data"
version = "0.1.0"
description = "Dataset acquisition and corpus build for PriorArt Atlas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "huggingface_hub>=0.25",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff.lint.per-file-ignores]
"scripts/update_dataset_readme.py" = ["E501"]
"scripts/run_samples.py" = ["E501"]
"scripts/seed_business_data.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
