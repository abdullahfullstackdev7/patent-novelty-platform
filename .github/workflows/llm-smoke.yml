# Manual job: one real call per LLM provider. Needs the repository secrets
# GROQ_API_KEY and GEMINI_API_KEY. Not part of the normal pipeline because it uses free-tier quota.
name: LLM provider smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run provider smoke tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          JWT_SECRET: smoke-test-only-secret-with-more-than-32-characters
        run: uv run pytest -m smoke -s -q
